<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Warda Anwar 🎂</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --deep-space: #0a0015;
            --midnight-purple: #1a0a2e;
            --rose-red: #c0392b;
            --soft-pink: #f4a0b0;
            --cream-white: #fff8f0;
            --gold-accent: #f5c518;
            --star-white: #fffde7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><text y='24' font-size='24'>🌸</text></svg>") 16 16, auto;
        }

        body {
            background-color: var(--deep-space);
            color: var(--cream-white);
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            overflow-y: hidden; /* Manage scrolling on a per-page basis if needed */
            cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><text y='24' font-size='24'>🌸</text></svg>") 16 16, auto;
            width: 100vw;
            height: 100vh;
        }

        a, button, canvas {
            cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><text y='24' font-size='24'>🌸</text></svg>") 16 16, auto;
        }

        /* Ambient Vignette Overlay */
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.85) 100%);
            pointer-events: none;
            z-index: 999;
        }

        /* Custom Heart Cursor */
        .custom-cursor {
            position: fixed;
            top: 0; left: 0;
            font-size: 24px;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 10000;
            text-shadow: 0 0 10px rgba(192, 57, 43, 0.8);
            transition: transform 0.1s ease-out; /* Slight lag for smoothness */
        }

        h1, h2, h3, h4 {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
        }

        /* Reusable Elegant Button */
        .btn {
            background: rgba(255, 248, 240, 0.08);
            border: 1px solid rgba(255, 248, 240, 0.3);
            color: var(--cream-white);
            padding: 12px 35px;
            font-size: 1.1rem;
            font-family: 'Poppins', sans-serif;
            border-radius: 40px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.4s ease;
            box-shadow: 0 0 15px rgba(255, 248, 240, 0.05);
            position: absolute;
            outline: none;
        }
        .btn:hover {
            background: rgba(255, 248, 240, 0.15);
            box-shadow: 0 0 25px rgba(255, 248, 240, 0.3);
            transform: scale(1.05);
        }
        .btn-bottom {
            bottom: 40px; 
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        .btn-bottom.float-right {
            left: auto;
            right: 40px;
            transform: none;
        }
        .btn-bottom.float-right:hover {
            transform: scale(1.05);
        }

        /* Fade-in Hidden Classes */
        .hiddenbtn {
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease;
        }
        .hiddenbtn.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* Page Structure & Reveal Mechanics */
        .page {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            overflow: hidden;
            z-index: 10;
        }
        .page.active-block {
            display: block;
        }
        .page.active {
            opacity: 1;
            transform: translateY(0);
            z-index: 20;
        }

        .fullscreen-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .t-center { text-align: center; }
        .content-layer {
            position: relative;
            z-index: 5;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* -------------------------------- */
        /* PAGE 1: Midnight Countdown       */
        /* -------------------------------- */
        .moon {
            width: 80px; height: 80px;
            border-radius: 50%;
            box-shadow: 18px 18px 0 0 var(--gold-accent);
            position: absolute; top: 10%; right: 10%;
            filter: drop-shadow(0 0 25px rgba(245, 197, 24, 0.4));
            animation: pulseMoon 4s infinite alternate;
            z-index: 2;
        }
        @keyframes pulseMoon { 
            0% { filter: drop-shadow(0 0 15px rgba(245,197,24,0.3)); } 
            100% { filter: drop-shadow(0 0 35px rgba(245,197,24,0.8)); } 
        }
        .magical-text {
            color: var(--cream-white); font-size: 2.2rem;
            text-shadow: 0 0 20px rgba(255,248,240,0.4);
            margin-bottom: 25px;
            letter-spacing: 1px;
            padding: 0 20px;
        }
        .countdown {
            font-size: 5rem;
            font-family: 'Poppins', sans-serif;
            font-weight: 300;
            color: var(--star-white);
            text-shadow: 0 0 20px rgba(255,253,231,0.6);
            animation: pulseText 2s infinite ease-in-out alternate;
            letter-spacing: 5px;
        }
        @keyframes pulseText { 
            0% { opacity: 0.85; text-shadow: 0 0 15px rgba(255,253,231,0.5); } 
            100% { opacity: 1; text-shadow: 0 0 35px rgba(255,253,231,1); } 
        }

        /* -------------------------------- */
        /* PAGE 2: Birthday Reveal          */
        /* -------------------------------- */
        .p2-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, var(--midnight-purple) 0%, var(--deep-space) 100%);
            z-index: 0;
        }
        .giant-hbd {
            font-size: 8vw;
            background: linear-gradient(90deg, #d39f20, #fff, #d39f20);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmer 4s infinite linear;
            margin-bottom: -10px;
            line-height: 1.2;
            z-index: 5;
            filter: drop-shadow(0 0 10px rgba(245,197,24,0.2));
            white-space: nowrap;
        }
        @media (max-width: 768px) { .giant-hbd { font-size: 14vw; } }
        @keyframes shimmer { to { background-position: 200% center; } }
        .name-subtitle {
            font-family: 'Great Vibes', cursive;
            font-size: 6rem;
            color: var(--soft-pink);
            text-shadow: 0 0 25px rgba(244,160,176,0.6);
            margin-top: 0;
            opacity: 0.9;
            z-index: 5;
        }
        /* Page 2 CSS Components */
        .balloons-layer, .roses-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; overflow: hidden; z-index: 2;
        }
        .balloon {
            position: absolute; width: 50px; height: 60px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            bottom: -100px; opacity: 0.85;
            animation: floatUp 15s infinite linear, sway 3s infinite ease-in-out alternate;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.2);
        }
        .balloon .string {
            position: absolute; bottom: -45px; left: 50%;
            width: 1px; height: 45px; background: rgba(255,255,255,0.4);
            transform: translateX(-50%);
        }
        @keyframes floatUp { 0% { bottom: -100px; } 100% { bottom: 120vh; } }
        @keyframes sway { 0% { transform: translateX(-15px); } 100% { transform: translateX(15px); } }

        .css-rose {
            position: absolute; bottom: -20px; width: 35px; height: 35px;
            background: var(--rose-red); border-radius: 50% 0 50% 50%;
            transform: rotate(45deg) scale(0);
            box-shadow: inset 8px 8px 15px rgba(0,0,0,0.4);
            animation: roseBloomInit 3s ease forwards;
        }
        .css-rose::after {
            content: ''; position: absolute; top: 7px; left: 7px;
            width: 20px; height: 20px; background: var(--cream-white);
            border-radius: 50% 0 50% 50%;
            box-shadow: inset 4px 4px 6px rgba(0,0,0,0.2);
        }
        @keyframes roseBloomInit { 0% { transform: rotate(45deg) scale(0); opacity: 0; } 100% { transform: rotate(45deg) scale(1); opacity: 0.9; } }

        /* -------------------------------- */
        /* PAGE 3: Love Letter              */
        /* -------------------------------- */
        .p3-bg {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: linear-gradient(to bottom, #2b1114, #1a0a1a); z-index: 0;
        }
        .letter-wrapper {
            position: relative; width: 350px; height: 500px;
            display: flex; justify-content: center; align-items: flex-end;
            z-index: 5; margin-bottom: 50px;
        }
        @media (max-width: 400px) { .letter-wrapper { transform: scale(0.85); } }
        
        .envelope-container {
            position: relative; width: 320px; height: 200px;
            transform: translateY(120px); transition: transform 1.5s ease;
        }
        .envelope-container.open { transform: translateY(0); }
        
        .envelope-back {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
            background: #8b231d; border-radius: 5px 5px 12px 12px; z-index: 1;
        }
        .envelope-front {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
            background: var(--rose-red); 
            clip-path: polygon(0 0, 50% 50%, 100% 0, 100% 100%, 0 100%);
            border-radius: 0 0 12px 12px; z-index: 4;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.25);
        }
        .envelope-flap {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #a83025;
            clip-path: polygon(0 0, 50% 60%, 100% 0);
            transform-origin: top; transition: transform 1.2s ease 0.3s;
            z-index: 5; border-radius: 5px 5px 0 0;
        }
        .envelope-container.open .envelope-flap {
            transform: rotateX(180deg); z-index: 1;
        }
        .envelope-paper {
            position: absolute; bottom: 10px; left: 15px; right: 15px;
            height: 180px; background: #fffdf5; border-radius: 4px;
            z-index: 2; transition: height 1.5s ease 1s, transform 1.5s ease 1s;
            overflow: hidden; padding: 30px 25px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.15);
        }
        .envelope-container.open .envelope-paper {
            height: 440px; transform: translateY(-30px);
        }
        .letter-content {
            font-family: 'Playfair Display', serif; color: #3a2222;
            font-size: 1.05rem; line-height: 1.7; white-space: pre-wrap; margin:0;
            text-shadow: 0 0 1px rgba(0,0,0,0.1);
        }
        .typewriter-cursor {
            display: inline-block; width: 2px; height: 1.1em;
            background: #a83025; animation: blink 1s infinite;
            vertical-align: middle; margin-left: 2px;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .rose-bloom {
            position: absolute; bottom: -30px; right: -60px;
            width: 120px; height: 160px; opacity: 0;
            transition: opacity 1s ease; z-index: 6; pointer-events: none;
        }
        .rose-bloom.show {
            animation: softBloom 2.5s ease forwards;
            transform-origin: bottom center;
        }
        @keyframes softBloom {
            0% { transform: scale(0.5) rotate(15deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* -------------------------------- */
        /* PAGE 4: Interactive Garden       */
        /* -------------------------------- */
        .p4-ui {
            position: absolute; top: 12%; left: 50%;
            transform: translateX(-50%); z-index: 5;
            text-shadow: 0 0 15px rgba(0,0,0,0.8);
            width: 100%;
        }
        .counter {
            font-size: 1.1rem; color: var(--soft-pink);
            font-family: 'Poppins', sans-serif;
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 20px; border-radius: 30px;
            display: inline-block; margin-top: 15px;
            backdrop-filter: blur(5px);
            transition: transform 0.2s ease;
        }
        .counter.pulse-pop { transform: scale(1.1); }

        /* -------------------------------- */
        /* PAGE 5: Birthday Wish            */
        /* -------------------------------- */
        .cake-container {
            position: relative; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; cursor: pointer; z-index: 5;
        }
        .wish-text {
            color: var(--star-white); font-size: 2.2rem; margin-bottom: 70px;
            text-shadow: 0 0 20px rgba(255,255,255,0.4);
            animation: pulseText 2.5s infinite alternate;
            letter-spacing: 1px; text-align: center;
        }
        .wish-text.fade-out { opacity: 0; transition: opacity 1s ease; }
        
        .cake { position: relative; width: 220px; height: 160px; margin-top: 20px; }
        .tier {
            position: absolute; left: 50%; transform: translateX(-50%);
            border-radius: 12px;
            box-shadow: inset 0 -12px 25px rgba(0,0,0,0.1), 0 5px 20px rgba(0,0,0,0.4);
        }
        .bottom-tier {
            bottom: 0; width: 240px; height: 85px;
            background: linear-gradient(to right, #e293a3, #fff1e8, #e293a3);
            border-radius: 12px 12px 18px 18px;
        }
        .top-tier {
            bottom: 85px; width: 160px; height: 75px;
            background: linear-gradient(to right, #f8f6f5, #ffffff, #f8f6f5);
            z-index: 2; border-radius: 12px 12px 6px 6px;
        }
        
        /* Drips */
        .drip { position: absolute; top: 0; left: 0; width: 100%; height: 20px; border-radius: 10px; z-index: 3; }
        .top-drip { background: #fff5eb; }
        .bottom-drip { background: var(--soft-pink); filter: brightness(1.05); }
        .drip::after, .drip::before {
            content: ''; position: absolute; width: 22px; height: 35px;
            background: inherit; border-radius: 12px;
        }
        .top-drip::after { top: 0; left: 25px; height: 32px; }
        .top-drip::before { top: 0; left: 70px; height: 42px; }
        .bottom-drip::after { top: 0; left: 45px; height: 40px; }
        .bottom-drip::before { top: 0; right: 35px; height: 48px; }

        .candles {
            position: absolute; bottom: 155px; left: 50%; transform: translateX(-50%);
            width: 130px; height: 50px; z-index: 4; display: flex;
            justify-content: space-between; align-items: flex-end;
        }
        .candle {
            width: 14px; height: 45px; position: relative; border-radius: 3px;
            background: repeating-linear-gradient(45deg, #fff, #fff 6px, var(--rose-red) 6px, var(--rose-red) 12px);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }
        .flame {
            position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
            width: 12px; height: 24px; background: #ffaa00;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px 5px rgba(255, 170, 0, 0.6);
            transform-origin: bottom center; animation: flicker 0.12s infinite alternate;
        }
        .c1 .flame { animation-delay: 0.1s; } 
        .c2 .flame { animation-delay: 0.4s; } 
        .c3 .flame { animation-delay: 0.2s; } 
        .c4 .flame { animation-delay: 0.5s; } 
        .c5 .flame { animation-delay: 0.3s; }
        @keyframes flicker {
            0% { transform: translateX(-50%) rotate(-4deg) scale(0.9); background: #ffaa00; }
            100% { transform: translateX(-50%) rotate(4deg) scale(1.1); background: #ffcc00; }
        }
        .flame.blown-out { opacity: 0; transition: opacity 0.2s ease; animation: none; }
        
        .smoke {
            position: absolute; top: -35px; left: 50%; width: 12px; height: 12px;
            background: rgba(255,255,255,0.6); border-radius: 50%;
            animation: puff 1.2s ease-out forwards; opacity: 0; pointer-events: none;
            filter: blur(2px);
        }
        @keyframes puff { 
            0% { transform: translateX(-50%) scale(1); opacity: 0.8; } 
            100% { transform: translateX(-50%) translateY(-40px) scale(4); opacity: 0; } 
        }

        .final-message {
            position: absolute; top: -110px; left: 50%; transform: translateX(-50%);
            width: 400px; text-align: center;
            font-family: 'Playfair Display', serif; font-size: 2rem;
            color: var(--gold-accent); opacity: 0; pointer-events: none;
            transition: opacity 2.5s ease; margin-top: 10px;
            text-shadow: 0 0 20px rgba(245,197,24,0.6);
            line-height: 1.4;
        }
        @media (max-width: 500px) { .final-message { font-size: 1.6rem; width: 90vw; top: -120px;} }
        
        .final-message.show {
            opacity: 1; transform: translateX(-50%) translateY(-25px);
            transition: opacity 2.5s ease, transform 2.5s ease;
        }
        .music-notes-container {
            display: flex; justify-content: center; gap: 20px;
            margin-top: 20px; font-size: 1.8rem;
        }
        .m-note { animation: floatNotes 3s infinite ease-in-out; }
        .m-note:nth-child(2) { animation-delay: 1.5s; font-size: 2rem; }
        @keyframes floatNotes { 
            0%, 100% { transform: translateY(0) rotate(-5deg); } 
            50% { transform: translateY(-15px) rotate(5deg); } 
        }
        
        /* Floating Emojis injected by JS */
        @keyframes floatUpEmoji {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            5% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Overlay elements -->
    <div class="vignette"></div>
    <div class="custom-cursor" id="custom-cursor" style="display:none;"></div>

    <main>
        <!-- PAGE 1: Midnight Countdown -->
        <section id="page-1" class="page">
            <canvas id="p1-canvas" class="fullscreen-canvas"></canvas>
            <div class="moon"></div>
            <div class="content-layer">
                <h2 class="magical-text">Something magical is about to happen...</h2>
                <div class="countdown" id="countdown">00:00:00</div>
            </div>
            <button class="btn btn-bottom" onclick="goToPage(2)">Can't wait? &rarr;</button>
        </section>
        
        <!-- PAGE 2: Birthday Reveal -->
        <section id="page-2" class="page">
            <div class="p2-bg"></div>
            <canvas id="p2-canvas" class="fullscreen-canvas" style="z-index:3;"></canvas>
            <div class="balloons-layer" id="balloons-layer"></div>
            <div class="roses-layer" id="roses-layer"></div>
            <div class="content-layer">
                <h1 class="giant-hbd">Happy Birthday</h1>
                <h2 class="name-subtitle">Warda Anwar 🌹</h2>
            </div>
            <button class="btn btn-bottom hiddenbtn" id="p2-next" onclick="goToPage(3)">Next &rarr;</button>
        </section>

        <!-- PAGE 3: Love Letter -->
        <section id="page-3" class="page">
            <div class="p3-bg"></div>
            <canvas id="p3-canvas" class="fullscreen-canvas" style="z-index: 1;"></canvas>
            
            <div class="content-layer">
                <div class="letter-wrapper">
                    <div class="envelope-container" id="env-container">
                        <div class="envelope-back"></div>
                        <div class="envelope-paper">
                            <div class="letter-content">
                                <p id="typewriter-text"></p>
                            </div>
                        </div>
                        <div class="envelope-flap" id="env-flap"></div>
                        <div class="envelope-front"></div>
                    </div>
                    <div class="rose-bloom" id="p3-rose"></div>
                </div>
            </div>
            <button class="btn btn-bottom hiddenbtn" id="p3-next" onclick="goToPage(4)">Next &rarr;</button>
        </section>

        <!-- PAGE 4: Interactive Garden -->
        <section id="page-4" class="page">
            <canvas id="p4-canvas" class="fullscreen-canvas" style="pointer-events: auto; z-index: 1;"></canvas>
            <div class="p4-ui" style="pointer-events: none;">
                <h2 class="magical-text" style="font-size: 1.8rem; margin-bottom:0;">Grow our garden — tap anywhere 🌹</h2>
                <div class="counter" id="rose-counter">🌹 0 roses bloomed</div>
            </div>
            <button class="btn btn-bottom float-right hiddenbtn show" onclick="goToPage(5)" style="z-index: 10;">Next &rarr;</button>
        </section>

        <!-- PAGE 5: Birthday Wish -->
        <section id="page-5" class="page">
            <canvas id="p5-canvas" class="fullscreen-canvas"></canvas>
            
            <div class="cake-container" id="the-cake">
                <h2 class="wish-text" id="wish-text">Close your eyes... make a wish 🌙</h2>
                <div class="cake">
                    <div class="candles" id="candles-container">
                        <div class="candle c1"><div class="flame"></div></div>
                        <div class="candle c2"><div class="flame"></div></div>
                        <div class="candle c3"><div class="flame"></div></div>
                        <div class="candle c4"><div class="flame"></div></div>
                        <div class="candle c5"><div class="flame"></div></div>
                    </div>
                    <div class="tier top-tier"><div class="drip top-drip"></div></div>
                    <div class="tier bottom-tier"><div class="drip bottom-drip"></div></div>
                </div>
                <div class="final-message" id="final-message">
                    May all your dreams come true.<br>Happy Birthday, Warda Anwar. ✨
                    <div class="music-notes-container">
                        <span class="m-note">🎵</span>
                        <span class="m-note">🎶</span>
                    </div>
                </div>
            </div>
            <button class="btn btn-bottom hiddenbtn" id="p5-restart" onclick="goToPage(1)" style="bottom: 30px;">Start Over 🔄</button>
        </section>
    </main>

    <script>
        console.log("Made with love 🌹");

        // Custom Cursor Logic
        const cursor = document.getElementById('custom-cursor');
        document.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // Common Canvas Utilities
        function resizeCanvas(c) {
            c.width = window.innerWidth;
            c.height = window.innerHeight;
        }
        window.addEventListener('resize', () => {
            document.querySelectorAll('.fullscreen-canvas').forEach(resizeCanvas);
        });

        // Core Navigation Logic
        function goToPage(pageNum) {
            if(document.body.classList.contains('transitioning')) return;
            document.body.classList.add('transitioning');
            
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            
            setTimeout(() => {

        // ==========================================
        // PAGE 1: Starfield & Countdown Logic
        // ==========================================
        const canvas1 = document.getElementById('p1-canvas');
        const ctx1 = canvas1.getContext('2d');
        let stars1 = [];
        let shootingStars = [];
        let p1ShootingInterval;

        function initP1() {
            resizeCanvas(canvas1);
            stars1 = []; shootingStars = [];
            for(let i=0; i<250; i++) {
                stars1.push({
                    x: Math.random() * canvas1.width,
                    y: Math.random() * canvas1.height,
                    r: Math.random() * 1.5 + 0.5,
                    alpha: Math.random(),
                    pulse: Math.random() * 0.015 + 0.005,
                    dir: Math.random() > 0.5 ? 1 : -1
                });
            }
            if(p1ShootingInterval) clearInterval(p1ShootingInterval);
            p1ShootingInterval = setInterval(() => {
                if(!document.getElementById('page-1').classList.contains('active')) return;
                if(Math.random() > 0.3) {
                    shootingStars.push({
                        x: Math.random() * canvas1.width,
                        y: Math.random() * (canvas1.height / 2), // start higher up
                        length: Math.random() * 80 + 30,
                        speed: Math.random() * 10 + 12,
                        alpha: 1
                    });
                }
            }, 3500);
        }

        function renderP1() {
            if(!document.getElementById('page-1').classList.contains('active')) return;
            ctx1.clearRect(0, 0, canvas1.width, canvas1.height);
            
            // Draw regular stars
            stars1.forEach(s => {
                s.alpha += s.pulse * s.dir;
                if(s.alpha >= 1) { s.alpha = 1; s.dir = -1; }
                if(s.alpha <= 0.1) { s.alpha = 0.1; s.dir = 1; }
                ctx1.beginPath();
                ctx1.fillStyle = `rgba(255, 253, 231, ${s.alpha})`;
                ctx1.arc(s.x, s.y, s.r, 0, Math.PI*2);
                ctx1.fill();
            });
            
            // Draw shooting stars
            for(let i=shootingStars.length-1; i>=0; i--) {
                let ss = shootingStars[i];
                ss.x -= ss.speed;
                ss.y += ss.speed;
                ss.alpha -= 0.025;
                
                ctx1.beginPath();
                // create glowing streak
                let grad = ctx1.createLinearGradient(ss.x, ss.y, ss.x + ss.length, ss.y - ss.length);
                grad.addColorStop(0, `rgba(255,255,255,${ss.alpha})`);
                grad.addColorStop(1, `rgba(255,255,255,0)`);
                ctx1.strokeStyle = grad;
                ctx1.lineWidth = 2.5;
                ctx1.lineCap = 'round';
                ctx1.moveTo(ss.x, ss.y);
                ctx1.lineTo(ss.x + ss.length, ss.y - ss.length);
                ctx1.stroke();
                
                if(ss.alpha <= 0) shootingStars.splice(i, 1);
            }
        }

        // Countdown Logic
        function updateCountdown() {

            midnight.setHours(24, 0, 0, 0); 
            
            let diff = Math.floor((midnight - now) / 1000);
            
            if (diff <= 0 && document.getElementById('page-1').classList.contains('active')) {
                document.getElementById('countdown').innerText = "00:00:00";
                goToPage(2);
                return;
            }
            
            let h = String(Math.floor(diff / 3600)).padStart(2, '0');
            let m = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
            let s = String(diff % 60).padStart(2, '0');
            document.getElementById('countdown').innerText = `${h}:${m}:${s}`;
        }

        // ==========================================
        // PAGE 4: Interactive WebGL-style Garden
        // ==========================================
        const canvas4 = document.getElementById('p4-canvas');
        const ctx4 = canvas4.getContext('2d');
        let flowers = [];
        let p4Stars = [];
        let ambientPetals = [];
        let bloomsCount = 0;
        
        // Pre-calculate path for petals and leaves
        const petalPath = new Path2D();
        petalPath.moveTo(0, 0);
        petalPath.bezierCurveTo(-15, -20, -20, -45, 0, -50);
        petalPath.bezierCurveTo(20, -45, 15, -20, 0, 0);

        const leafLeftPath = new Path2D();
        leafLeftPath.moveTo(0, 0);
        leafLeftPath.bezierCurveTo(-15, -5, -20, -20, -5, -25);
        leafLeftPath.bezierCurveTo(0, -15, 5, -5, 0, 0);

        const leafRightPath = new Path2D();
        leafRightPath.moveTo(0, 0);
        leafRightPath.bezierCurveTo(15, -5, 20, -20, 5, -25);
        leafRightPath.bezierCurveTo(0, -15, -5, -5, 0, 0);

        const fColorsRGB = [
            {r: 192, g: 57, b: 43},  // #c0392b
            {r: 244, g: 160, b: 176},// #f4a0b0
            {r: 123, g: 45, b: 139}, // #7b2d8b
            {r: 231, g: 76, b: 60},  // #e74c3c
            {r: 255, g: 240, b: 245} // #fff0f5
        ];

        function easeOutBack(x) {
            const c1 = 1.70158;
            const c3 = c1 + 1;
            return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
        }

        function initP4() {
            resizeCanvas(canvas4);
            flowers = [];
            bloomsCount = 0;
            updateCounter();
            
            p4Stars = Array.from({length: 180}, () => ({
                x: Math.random()*canvas4.width, 
                y: Math.random()*canvas4.height, 
                r: Math.random()*1.5 + 0.5, 
                pulsing: Math.random() * Math.PI*2
            }));
            
            ambientPetals = Array.from({length: 25}, () => ({
                x: Math.random()*canvas4.width, 
                y: Math.random()*canvas4.height,
                vx: -Math.random()*1.2 - 0.5, 
                vy: Math.random()*0.8 + 0.2, 
                rot: Math.random()*Math.PI*2, 
                rSpeed: Math.random()*0.05-0.025,
                colorRaw: fColorsRGB[Math.floor(Math.random()*fColorsRGB.length)]
            }));
        }

        function updateCounter() {
            const counter = document.getElementById('rose-counter');
            counter.innerText = `🌹 ${bloomsCount} roses bloomed`;
            counter.classList.remove('pulse-pop');
            void counter.offsetWidth; // trigger reflow
            counter.classList.add('pulse-pop');
        }

        function handleP4Click(x, y) {
            if(!document.getElementById('page-4').classList.contains('active')) return;
            bloomsCount++;
            updateCounter();
            
            let scaleRange = Math.random() * 0.3 + 0.7; // 0.7 to 1.0
            
            flowers.push({
                x: x,
                y: y,
                rgb: fColorsRGB[Math.floor(Math.random() * fColorsRGB.length)],
                scale: scaleRange,
                maxStemH: canvas4.height - y + 50, // Drawn from slightly below bottom 
                createdAt: Date.now(),
                timeOffset: Math.random() * 100,
                displayAge: 0 // Interlaced to array age for DoF simulation
            });

            if (flowers.length > 30) {
                flowers.shift(); // Limit max flowers to 30 for performance
            }
        }

        canvas4.addEventListener('mousedown', (e) => handleP4Click(e.clientX, e.clientY));
        canvas4.addEventListener('touchstart', (e) => {
            handleP4Click(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: true});

        function renderP4() {
            if(!document.getElementById('page-4').classList.contains('active')) return;
            ctx4.clearRect(0,0,canvas4.width, canvas4.height);
            
            const now = Date.now();
            const timeStr = now / 1000;

            // Draw Stars
            ctx4.fillStyle = '#fff';
            p4Stars.forEach(s => {
                let pulse = Math.abs(Math.sin(timeStr + s.pulsing));
                ctx4.globalAlpha = pulse * 0.6 + 0.2;
                ctx4.beginPath(); ctx4.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx4.fill();
            });
            ctx4.globalAlpha = 1;

            // Draw Wind Petals
            ambientPetals.forEach(p => {
                p.x += p.vx; 
                p.y += p.vy; 
                p.rot += p.rSpeed;
                if(p.x < -20) { p.x = canvas4.width+20; p.y = Math.random()*canvas4.height; }
                if(p.y > canvas4.height + 20) { p.y = -20; }
                
                ctx4.save(); 
                ctx4.translate(p.x, p.y); 
                ctx4.scale(0.3, 0.3); // Scale down ambient petals
                ctx4.rotate(p.rot);
                ctx4.fillStyle = `rgb(${p.colorRaw.r},${p.colorRaw.g},${p.colorRaw.b})`;
                ctx4.globalAlpha = 0.5;
                ctx4.fill(petalPath);
                ctx4.restore();
            });
            ctx4.globalAlpha = 1;

            // Draw Flowers Loop
            flowers.forEach((f, index) => {
                // Determine Age for Depth of Field
                let targetAge = (flowers.length - 1) - index;
                f.displayAge += (targetAge - f.displayAge) * 0.05; // Smooth progression

                let elapsed = now - f.createdAt;
                let progress = Math.min(elapsed / 800, 1);
                
                let stemP = Math.min(progress / 0.4, 1);
                let petalsP = Math.max(0, (progress - 0.4) / 0.6);
                let petalScale = petalsP > 0 ? easeOutBack(petalsP) : 0;

                let currentStemH = f.maxStemH * stemP;
                let swayRot = (Math.sin(timeStr * 1.5 + f.timeOffset) * 2) * Math.PI / 180 * progress;

                // DoF Calculations (up to 15 clicks back)
                let ageFactor = Math.min(f.displayAge / 15, 1); 
                
                let gray = (f.rgb.r + f.rgb.g + f.rgb.b) / 3;
                let cR = f.rgb.r * (1 - ageFactor) + gray * ageFactor;
                let cG = f.rgb.g * (1 - ageFactor) + gray * ageFactor;
                let cB = f.rgb.b * (1 - ageFactor) + gray * ageFactor;
                let finalColor = `rgb(${Math.round(cR)},${Math.round(cG)},${Math.round(cB)})`;
                
                let finalAlpha = 1 - (ageFactor * 0.7); 
                let ageScale = 1 - (ageFactor * 0.4); 
                let finalPetalScale = f.scale * petalScale * ageScale;

                ctx4.save();
                ctx4.translate(f.x, canvas4.height + 50); // Origin base bottom 
                
                ctx4.globalAlpha = Math.max(0, finalAlpha);
                ctx4.rotate(swayRot);

                // Draw Stem
                if (stemP > 0) {
                    ctx4.beginPath();
                    ctx4.moveTo(0, 0); 
                    
                    let curveX = (f.timeOffset % 2 === 0 ? 1 : -1) * 15; 
                    ctx4.quadraticCurveTo(curveX, -currentStemH/2, 0, -currentStemH);
                    
                    let stR = 43 * (1-ageFactor) + 60 * ageFactor;
                    let stG = 94 * (1-ageFactor) + 60 * ageFactor;
                    let stB = 52 * (1-ageFactor) + 60 * ageFactor;
                    ctx4.strokeStyle = `rgb(${Math.round(stR)},${Math.round(stG)},${Math.round(stB)})`;
                    ctx4.lineWidth = 3.5 * ageScale;
                    ctx4.lineCap = 'round';
                    ctx4.stroke();

                    // Stem Leaves
                    if (stemP > 0.5) {
                        let leafSc = (stemP - 0.5) * 2;
                        ctx4.fillStyle = ctx4.strokeStyle;
                        
                        ctx4.save();
                        ctx4.translate(curveX * 0.5, -currentStemH * 0.4); 
                        ctx4.scale(leafSc * ageScale, leafSc * ageScale);
                        ctx4.fill(leafLeftPath);
                        ctx4.restore();
                        
                        ctx4.save();
                        ctx4.translate(curveX * 0.5, -currentStemH * 0.6);
                        ctx4.scale(leafSc * ageScale, leafSc * ageScale);
                        ctx4.fill(leafRightPath);
                        ctx4.restore();
                    }
                }

                // Draw Bloom Petals
                if (petalScale > 0) {
                    ctx4.save();
                    ctx4.translate(0, -currentStemH); // Move to tip of stem
                    
                    for (let layer = 0; layer < 2; layer++) {
                        let layerScale = 1 - (layer * 0.25); 
                        let rotOffset = layer * (Math.PI / 5);
                        
                        ctx4.save();
                        ctx4.scale(finalPetalScale * layerScale, finalPetalScale * layerScale);
                        ctx4.rotate(rotOffset);
                        
                        ctx4.fillStyle = finalColor;
                        ctx4.globalAlpha = Math.max(0, finalAlpha * 0.75); // Layer opacity overlap
                        
                        for (let i = 0; i < 6; i++) {
                            ctx4.fill(petalPath);
                            // Detail line via stroke
                            ctx4.strokeStyle = 'rgba(0,0,0,0.1)';
                            ctx4.lineWidth = 0.5;
                            ctx4.stroke(petalPath);
                            ctx4.rotate((Math.PI * 2) / 6);
                        }
                        ctx4.restore();
                    }

                    // Dark Center Core
                    ctx4.globalAlpha = Math.max(0, finalAlpha);
                    ctx4.fillStyle = '#1c0909'; 
                    ctx4.scale(finalPetalScale, finalPetalScale);
                    ctx4.beginPath();
                    ctx4.arc(0, 0, 9, 0, Math.PI*2);
                    ctx4.fill();
                    
                    // Golden Dots
                    let dR = 245 * (1-ageFactor) + 128 * ageFactor;
                    let dG = 197 * (1-ageFactor) + 128 * ageFactor;
                    let dB = 24  * (1-ageFactor) + 128 * ageFactor;
                    ctx4.fillStyle = `rgb(${Math.round(dR)},${Math.round(dG)},${Math.round(dB)})`;
                    for (let i = 0; i < 7; i++) {
                        let a = (Math.PI*2/7) * i;
                        ctx4.beginPath();
                        ctx4.arc(Math.cos(a)*5, Math.sin(a)*5, 1.5, 0, Math.PI*2);
                        ctx4.fill();
                    }
                    ctx4.restore();
                }

                ctx4.restore(); 
            });
            ctx4.globalAlpha = 1;
        }


        // ==========================================

        // ==========================================

        function createCakeBurst() {
            const cakeBox = document.querySelector('.cake').getBoundingClientRect();
            const cx = cakeBox.left + cakeBox.width / 2;
            const cy = cakeBox.top; // Burst from top of cake
            
            const colors = ['#f5c518', '#ffffff', '#f4a0b0', '#c0392b'];
            for(let i=0; i<150; i++) {
                sparks.push({
                    x: cx, y: cy,
                    vx: (Math.random()-0.5)*18,
                    vy: (Math.random()-0.5)*18 - 5, // bias upwards
                    life: 1, 
                    dec: Math.random()*0.015 + 0.005,
                    color: colors[Math.floor(Math.random()*colors.length)],
                    r: Math.random() * 3 + 1
                });
            }
        }

        function createFloatingEmojis() {
            const mNotes = ['🎵', '🎶', '✨', '💖', '🥂'];
            for(let i=0; i<12; i++) {
                let note = document.createElement('div');
                note.innerText = mNotes[Math.floor(Math.random()*mNotes.length)];
                note.style.position = 'absolute';
                note.style.left = (Math.random()*90 + 5) + 'vw';
                note.style.bottom = '-60px'; // below screen
                note.style.fontSize = (Math.random()*20 + 24) + 'px';
                note.style.zIndex = '8';
                note.style.pointerEvents = 'none';
                note.style.animation = `floatUpEmoji ${Math.random()*6 + 6}s linear forwards`;
                note.style.animationDelay = (Math.random() * 2) + 's';
                document.getElementById('page-5').appendChild(note);
                p5Emojis.push(note);
            }
        }

        function renderP5() {
            if(!document.getElementById('page-5').classList.contains('active')) return;
            ctx5.clearRect(0,0,canvas5.width, canvas5.height);
            
            const time = Date.now() / 1000;

            // Subtle Background Stars
            ctx5.fillStyle = '#fff';
            p4Stars.forEach(s => {
                let pulse = Math.abs(Math.sin(time + s.pulsing));
                ctx5.globalAlpha = pulse * 0.4 + 0.1; // much more subtle than P4
                ctx5.beginPath(); ctx5.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx5.fill();
            });
            ctx5.globalAlpha = 1;
            
            // Physics Sparks
            for(let i=sparks.length-1; i>=0; i--) {
                let s = sparks[i];
                s.x += s.vx; 
                s.y += s.vy; 
                s.vy += 0.25; // gravity
                s.life -= s.dec;
                
                if(s.life <= 0) { sparks.splice(i,1); continue; }
                
                ctx5.fillStyle = s.color;
                ctx5.globalAlpha = s.life;
                ctx5.beginPath(); 
                ctx5.arc(s.x, s.y, s.r * s.life, 0, Math.PI*2); 
                ctx5.fill();
            }
            ctx5.globalAlpha = 1;
        }

        // ==========================================
        // MASTER RENDER LOOP
        // ==========================================
        function masterLoop() {
            requestAnimationFrame(masterLoop);
            renderP1();
            renderP2();
            renderP3();
            renderP4();
            renderP5();
        }

        // Boot
        window.onload = () => {
            initP1();
            // Ensure only Page 1 is visible on start
            document.querySelectorAll('.page').forEach(p => {
                p.classList.remove('active');
                p.classList.remove('active-block');
            });
            const p1 = document.getElementById('page-1');
            p1.classList.add('active-block');
            setTimeout(() => p1.classList.add('active'), 50);

            masterLoop(); // Kick off the hardware-accelerated draw loop
        };

    </script>
</body>
</html>
